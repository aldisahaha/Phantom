<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Phantom — everyday streetwear essentials.">
    <title>Phantom® — Streetwear Essentials</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="#home" class="logo">Phantom<span>®</span></a>
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#products" id="shop-link">Shop</a>
        </div>
        <button class="cart-button" id="cart-open" type="button">
            BAG (<span id="cart-count">0</span>)
        </button>
    </nav>

    <main>
        <section class="hero" id="home">
            <div class="hero-copy">
                <p class="eyebrow">PHANTOM — NEW SEASON</p>
                <h1 class="spider-title">S<span class="red-p">P</span>IDER</h1>
                <a href="#products" class="hero-button" id="hero-shop">
                    Shop the collection <span>↗</span>
                </a>
            </div>
            <div class="hero-art">
                <img src="phantom.webp">
            </div>
        </section>
        <section class="products-section" id="products">
            <div class="products-header">
                <div>
                    <p class="eyebrow">THE COLLECTION</p>
                    <h2>Latest essentials<span>.</span></h2>
                </div>
                <p class="product-count" id="product-count">4 PRODUCTS</p>
            </div>

            <div class="product-tools">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-category="all" type="button">All</button>
                    <button class="filter-btn" data-category="tops" type="button">Tops</button>
                    <button class="filter-btn" data-category="bottoms" type="button">Bottoms</button>
                    <button class="filter-btn" data-category="accessories" type="button">Accessories</button>
                </div>
                <div class="product-controls">
                    <label class="product-search">
                        <span class="sr-only">Search products</span>
                        <input type="search" id="product-search" placeholder="Search products...">
                    </label>
                    <label>
                        <span class="sr-only">Sort products</span>
                        <select id="product-sort">
                            <option value="featured">Featured</option>
                            <option value="price-low">Price: Low to high</option>
                            <option value="price-high">Price: High to low</option>
                            <option value="name">Name: A to Z</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="product-grid" id="product-grid"></div>
            <p class="no-products" id="no-products" hidden>No products found. Try another search.</p>
        </section>
    </main>

    <footer class="footer">
        <a href="#home" class="logo">Phantom<span>®</span></a>
        <p>Phantom2026®</p>
        <span>© <span id="year"></span> PHANTOM®</span>
    </footer>

    <div class="cart-overlay" id="cart-overlay"></div>
    <aside class="cart-drawer" id="cart-drawer" aria-label="Shopping bag" aria-hidden="true">
        <div class="cart-header">

            <div>
                <p class="eyebrow">YOUR SELECTION</p>
                <h2>Your bag <span id="cart-heading-count">(0)</span></h2>
            </div>
            <button class="icon-button" id="cart-close" type="button" aria-label="Close bag">✕</button>
        </div>
        
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total"><span>Subtotal</span><strong id="cart-subtotal">₱0.00</strong></div>
            <p class="cart-note">Shipping is calculated at checkout.</p>
            <button class="checkout-button" id="checkout-button" type="button">Continue to checkout ↗</button>
            <button class="continue-shopping" id="continue-shopping" type="button">Continue shopping</button>
        </div>

    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
